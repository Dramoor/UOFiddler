name: Build & Release

on:
  push:
    branches:
      - "master"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # Upgraded to allow release creation and asset uploading

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Release

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1
      Solution_Name: UoFiddler.sln
      # Dynamic name: uses version tag if available, falls back to "master" if pushing code
      Asset_Name: UOFiddler-${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Install .NET Core
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Restore & build the application
        run: dotnet build $env:Solution_Name --configuration $env:Configuration
        env:
          Configuration: ${{ matrix.configuration }}

      # 1. Saves your compiled files to the Actions tab
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ env.Asset_Name }}-raw
          path: ./UOFiddler/bin/Release/

      # 2. Creates the clean production ZIP folder using PowerShell
      - name: Compress Release Assets
        shell: pwsh
        run: |
          Compress-Archive -Path ./UOFiddler/bin/Release/* -DestinationPath ./${{ env.Asset_Name }}.zip

      # 3. Only pushes to the website Releases tab IF you pushed a version tag (e.g. 1.0.0)
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: UOFiddler ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ env.Asset_Name }}.zip
